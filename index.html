function renderStudyAid(s,chapter){const a=studyAids[`${s.slug}:${chapter.number}`];if(!a)return'';let visual=`<section class="study-visual"><div class="study-visual-head"><i class="fa-solid fa-diagram-project"></i> Entenda visualmente</div><div class="study-visual-grid">${a.v.map(x=>`<div class="visual-card"><i class="fa-solid ${x[0]}"></i><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div></section>`;let table='';if(a.t){let [heads,...rows]=a.t;table=`<section class="study-table-wrap"><h3 class="study-table-title"><i class="fa-solid fa-table-list"></i> Quadro de revisão</h3><table class="study-table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></section>`}return visual+table+`<aside class="exam-tip"><strong><i class="fa-solid fa-lightbulb"></i> Atenção para a prova</strong>${a.d}</aside>`}

<script>
const app=document.querySelector('#app'),subjects=window.manualSubjects||[];
const modules=[['#2563eb','fa-id-card','PASSO A PASSO','Guia Definitivo da CNH','Entenda o processo da primeira habilitação, dos exames às aulas e à aprovação.'],['#f59e0b','fa-book-open','CONTEÚDO COMPLETO','Preparatório para Prova Teórica','Leia o conteúdo completo do manual, organizado em seis disciplinas.'],['#4f46e5','fa-brain','PSICOTÉCNICO','Desmistificando o Exame Psicológico','Orientações para entender a avaliação e chegar mais tranquilo.'],['#e11d48','fa-clipboard-check','TESTE REAL','Simulados Oficiais Detran','Treine seus conhecimentos em um ambiente focado na prova.'],['#059669','fa-car','ETAPA FINAL','Preparação para a Prova Prática','Percurso, comandos do examinador e faltas mais comuns.'],['#2563eb','fa-circle-question','SUPORTE & FAQ','Central de Dúvidas Frequentes','Respostas rápidas sobre prazos, taxas e reagendamentos.']];
const chapterPlan={legislacao:[['Fundamentos da Legislação e Sistema de Trânsito',0,2],['Habilitação, Categorias e Documentos',2,5],['Normas de Circulação e Conduta',5,8],['Infrações, Penalidades e Crimes de Trânsito',8,11],['Sinalização Vertical e Placas',11,18],['Sinalização Horizontal, Semafórica e Gestos',18,22]],'direcao-defensiva':[['Princípios da Direção Defensiva',0,1],['Atenção, Comportamento e Responsabilidade',1,3],['Condições Adversas da Via e do Clima',3,6],['Condições do Condutor, Álcool e Sono',6,9],['Prevenção de Colisões e Condução Segura',9,13]],'primeiros-socorros':[['Segurança no Local do Acidente',0,1],['Sinalização e Acionamento do Socorro',1,2],['Avaliação da Vítima e Reanimação',2,4],['Desmaio, Choque e Hemorragias',4,6],['Fraturas, Traumas e Ferimentos',6,9]],cidadania:[['Cidadania, Direitos e Deveres no Trânsito',0,1],['Educação, Respeito e Campanhas de Trânsito',1,2],['Convivência Social e Mobilidade',2,3]],'meio-ambiente':[['Trânsito e Preservação do Meio Ambiente',0,1],['Órgãos Ambientais e Responsabilidade',1,2],['Poluição Veicular e Controle de Emissões',2,3],['Poluição Sonora, Água e Sustentabilidade',3,5]],mecanica:[['Manutenção Preventiva e Funcionamento do Veículo',0,1],['Motor e Sistema de Alimentação',1,2],['Transmissão e Conjunto de Força',2,3],['Sistema de Freios',3,4],['Direção, Suspensão e Segurança',4,5],['Pneus, Equipamentos e Cuidados Essenciais',5,6]]};
function totals(){return subjects.reduce((n,s)=>n+s.pages.length,0)}function esc(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function paras(t){let lines=t.split(/\n+/).map(l=>l.trim()).filter(Boolean),out=[],ul=[];const flushUl=()=>{if(ul.length){out.push('<ul class="paper-list">'+ul.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');ul=[]}};lines.forEach(l=>{if(/^[•\-]\s*/.test(l)){ul.push(l.replace(/^[•\-]\s*/,''));return}flushUl();if(l.length<95&&(/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9\s—\-()/,"ºª.:]+$/.test(l)||/^(?:\d+(?:\.\d+|\.[a-z]\))?\s+[A-ZÁÉÍÓÚÂÊÔÃÕÇ])/.test(l))){out.push('<h3 class="paper-subhead">'+esc(l)+'</h3>')}else{out.push('<p>'+esc(l)+'</p>')}});flushUl();return out.join('')}function topicTitle(p,i){let h=p.text.split(/[\n.!?]/).map(s=>s.trim()).find(s=>s&&!/^Capítulo\s+\d+/i.test(s))||p.text.split(/[.!?]/)[0];h=h.replace(/^Capítulo\s+\d+\s*-?\s*/i,'').trim().replace(/\s+/g,' ');if(h.length>78)h=h.slice(0,78).replace(/\s+\S*$/,'')+'…';return h.length>7?h:'Tópico '+(i+1)}
function home(){app.innerHTML=`<section class="hero"><div class="shell hero-inner"><span class="eyebrow"><i class="fa-solid fa-graduation-cap"></i> Plataforma teórica de apoio</span><h1>Plataforma de Estudos<br><span>Instrutor Micael Lucas</span></h1><p>Sua direção começa com confiança. Prepare-se com conteúdo organizado e avance no seu ritmo para a prova teórica.</p></div></section><section class="section"><div class="shell"><div class="section-head"><div><h2>Módulos do Sistema de Ensino</h2><p>Toque em um módulo para acessar conteúdos e orientações.</p></div><span class="pill">6 módulos disponíveis</span></div><div class="modules">${modules.map((m,i)=>`<article class="card ${i===1?'featured':''}" data-module="${i}" style="--accent:${m[0]}"><div class="card-top"><span class="icon"><i class="fa-solid ${m[1]}"></i></span><span class="tag">${m[2]}</span></div><h3>${m[3]}</h3><p>${m[4]}</p><div class="card-foot"><span><i class="fa-regular fa-clock"></i> ${i===1?'Leitura por disciplina':'Área do módulo'}</span><button class="card-action" type="button">Acessar módulo <i class="fa-solid fa-arrow-right"></i></button></div></article>`).join('')}</div></div></section>`;document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>location.hash='modulo/'+b.dataset.module)}
function guideCNH(){app.innerHTML=`<section class="subhero"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button><span>Início</span><i class="fa-solid fa-chevron-right"></i><span>Guia Definitivo da CNH</span></div><span class="eyebrow"><i class="fa-solid fa-id-card"></i> PASSO A PASSO</span><h1>Guia Definitivo da CNH</h1><p>Tudo que você precisa saber sobre o processo da primeira habilitação, do início ao fim, de forma clara e sem enrolação.</p></div></section><section class="section"><div class="shell"><style>.guide-steps{display:flex;flex-direction:column;gap:0}.guide-step{display:grid;grid-template-columns:64px 1fr;gap:0 24px;position:relative}.guide-step:not(:last-child):before{content:'';position:absolute;left:31px;top:64px;bottom:0;width:2px;background:linear-gradient(var(--step-color,#2563eb),#e1e8f2);z-index:0}.guide-step-badge{width:64px;height:64px;border-radius:50%;background:var(--step-color,#2563eb);color:#fff;display:grid;place-items:center;font:800 22px Montserrat;flex-shrink:0;position:relative;z-index:1;box-shadow:0 4px 16px color-mix(in srgb,var(--step-color,#2563eb) 40%,transparent)}.guide-step-body{background:#fff;border:1px solid var(--line);border-left:4px solid var(--step-color,#2563eb);border-radius:0 16px 16px 0;padding:22px 26px;margin-bottom:28px}.guide-step-body h3{font:800 18px Montserrat;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:10px}.guide-step-body h3 i{color:var(--step-color,#2563eb)}.guide-step-body p{color:#455268;font-size:15px;line-height:1.7;margin:0 0 10px}.guide-step-body p:last-child{margin:0}.guide-tip{margin-top:14px;padding:12px 16px;border-radius:10px;background:color-mix(in srgb,var(--step-color,#2563eb) 9%,white);border:1px solid color-mix(in srgb,var(--step-color,#2563eb) 22%,white);font-size:13px;color:#3a4e6a;display:flex;gap:10px;align-items:flex-start}.guide-tip i{margin-top:2px;color:var(--step-color,#2563eb);flex-shrink:0}.guide-highlight{display:inline-block;background:var(--gold);color:#172033;border-radius:6px;padding:2px 8px;font-weight:800;font-size:14px}.guide-link{color:#2563eb;font-weight:700;text-decoration:underline}.guide-cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.guide-cat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#f9fbfd;font-size:13px;font-weight:700;color:#2c3e55;display:flex;align-items:center;gap:8px}.guide-cat i{color:var(--step-color,#2563eb)}.guide-badge-ok{display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#166534;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:800}@media(max-width:600px){.guide-step{grid-template-columns:44px 1fr}.guide-step-badge{width:44px;height:44px;font-size:16px}.guide-step:not(:last-child):before{left:21px;top:44px}}</style><div class="section-head"><div><h2>Como tirar sua CNH — Passo a Passo</h2><p>Siga cada etapa com atenção. Não pule nenhuma!</p></div><span class="pill">7 etapas</span></div><div class="guide-steps"><div class="guide-step" style="--step-color:#7c3aed"><div class="guide-step-badge">1</div><div class="guide-step-body"><h3><i class="fa-solid fa-mobile-screen-button"></i> Baixe o aplicativo CNH Digital Brasil</h3><p>O ponto de partida de tudo é o <strong>aplicativo CNH Digital Brasil</strong>, disponível gratuitamente para <strong>Android</strong> e <strong>iPhone</strong>.</p><p>Dentro do aplicativo você vai realizar o <strong>Curso Teórico Online</strong> — assista todas as aulas e ao concluir o próprio app emite o <strong>Certificado de Conclusão</strong>. Guarde esse certificado, ele será exigido no Detran.</p><div class="guide-tip"><i class="fa-solid fa-circle-info"></i><span>Você não precisa imprimir nada. O certificado fica salvo digitalmente no próprio aplicativo.</span></div></div></div><div class="guide-step" style="--step-color:#2563eb"><div class="guide-step-badge">2</div><div class="guide-step-body"><h3><i class="fa-solid fa-building-columns"></i> Vá ao Detran para iniciar o processo</h3><p>Com o curso concluído, dirija-se pessoalmente a um posto do <strong>Detran</strong> para dar início à sua primeira habilitação. Leve o celular com o aplicativo da CNH Digital Brasil para que eles possam <strong>identificar sua conclusão do curso</strong>.</p><p>No Detran você vai:</p><ul style="margin:8px 0 12px;padding-left:20px;color:#455268;font-size:15px;line-height:2"><li>Escolher a <strong>categoria</strong> desejada (veja abaixo)</li><li>Agendar o <strong>exame psicotécnico</strong> (eles já indicam a clínica credenciada)</li><li>Pagar a <strong>taxa inicial</strong></li></ul><div class="guide-cats"><div class="guide-cat"><i class="fa-solid fa-motorcycle"></i> Apenas <strong>A</strong> (moto)</div><div class="guide-cat"><i class="fa-solid fa-car-side"></i> Apenas <strong>B</strong> (carro)</div><div class="guide-cat"><i class="fa-solid fa-car-side"></i><i class="fa-solid fa-motorcycle"></i> <strong>AB</strong> (moto + carro)</div></div><div class="guide-tip"><i class="fa-solid fa-triangle-exclamation"></i><span>As categorias <strong>C, D e E</strong> (caminhão, ônibus, combinados) só podem ser tiradas depois que você já tiver a categoria <strong>B</strong>.</span></div><div class="guide-tip" style="margin-top:8px"><i class="fa-solid fa-circle-dollar-to-slot"></i><span>A taxa paga no Detran é em torno de <span class="guide-highlight">R$ 180</span>. Este valor pode ser reajustado — verifique o valor atual no balcão.</span></div></div></div><div class="guide-step" style="--step-color:#0891b2"><div class="guide-step-badge">3</div><div class="guide-step-body"><h3><i class="fa-solid fa-brain"></i> Faça o exame psicotécnico</h3><p>No dia agendado, compareça à clínica indicada pelo Detran para realizar o <strong>exame psicotécnico</strong> (avaliação psicológica).</p><p>O resultado sai em até <span class="guide-highlight">7 dias</span>. Se não passar, fique tranquilo: você tem direito a um <strong>reteste gratuito</strong> — e muitas vezes o reteste é apenas na atividade em que você teve dificuldade.</p><div class="guide-tip"><i class="fa-solid fa-lightbulb"></i><span>Não é difícil. O segredo é <strong>prestar atenção</strong> durante as atividades e não se apressar. Respire fundo e vá com calma.</span></div></div></div><div class="guide-step" style="--step-color:#059669"><div class="guide-step-badge">4</div><div class="guide-step-body"><h3><i class="fa-solid fa-file-pen"></i> Estude e agende a prova teórica</h3><p>Com o psicotécnico aprovado, o próximo passo é a <strong>prova teórica</strong>. Esta plataforma tem o <strong>conteúdo completo</strong> organizado e simulados para você se preparar com segurança.</p><p>O agendamento é feito pelo site oficial do Detran-BA:</p><a class="guide-link" href="https://servicos.detran.ba.gov.br/" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> servicos.detran.ba.gov.br</a><div class="guide-tip" style="margin-top:14px"><i class="fa-solid fa-calendar-clock"></i><span>Agende assim que o resultado do psicotécnico aparecer no aplicativo CNH Digital Brasil. Com a alta demanda, a data mais próxima costuma ter no mínimo <strong>20 dias de espera</strong> — não deixe para última hora.</span></div></div></div><div class="guide-step" style="--step-color:#f59e0b"><div class="guide-step-badge">5</div><div class="guide-step-body"><h3><i class="fa-solid fa-car"></i> Aulas práticas com o Instrutor Micael Lucas</h3><p>Aprovado na teórica, chegou a hora das <strong>aulas práticas</strong>! O Instrutor Micael Lucas vai te guiar em tudo, do zero à aprovação.</p><p>Não sabe dirigir ainda? <strong>Sem problema</strong> — ele te ensina do absoluto início e te deixa pronto para enfrentar a prova com confiança.</p><ul style="margin:8px 0 12px;padding-left:20px;color:#455268;font-size:15px;line-height:2"><li>O mesmo <strong>carro e moto</strong> que você treina é o que você usa na prova</li><li>O instrutor <strong>vai com você</strong> no dia da prova prática</li><li>As provas práticas acontecem toda <strong>terça-feira</strong></li><li>Só é possível fazer <strong>um veículo por vez</strong> (moto ou carro)</li></ul><div class="guide-tip"><i class="fa-solid fa-star"></i><span>Você entra na prova conhecendo o veículo, o instrutor e o percurso — isso faz toda a diferença!</span></div></div></div><div class="guide-step" style="--step-color:#e11d48"><div class="guide-step-badge">6</div><div class="guide-step-body"><h3><i class="fa-solid fa-flag-checkered"></i> Prova prática — é a reta final!</h3><p>Com as aulas concluídas, você está pronto para a <strong>prova prática</strong>. Lembre-se: as provas são realizadas todas as <strong>terças-feiras</strong> e você faz <strong>um veículo por vez</strong>.</p><p>Se tiver feito a categoria AB, primeiro você faz a prova de um veículo e, depois de aprovado, agenda a prova do outro.</p><div class="guide-tip"><i class="fa-solid fa-check-circle"></i><span>O Instrutor Micael Lucas acompanha você até o final. Confie no treino — você chega preparado!</span></div></div></div><div class="guide-step" style="--step-color:#4f46e5"><div class="guide-step-badge">7</div><div class="guide-step-body"><h3><i class="fa-solid fa-id-card"></i> PPD e CNH definitiva — missão cumprida!</h3><p>Concluídas todas as etapas, você receberá a <strong>PPD (Permissão Para Dirigir)</strong>. Você fica com ela por <span class="guide-highlight">1 ano</span> dirigindo sem infrações graves.</p><p>Após esse período, sem pendências, sua <strong>CNH definitiva</strong> é emitida automaticamente.</p><div class="guide-tip"><i class="fa-solid fa-shield-halved"></i><span>Durante o ano da PPD, dirija com responsabilidade — qualquer infração grave pode reiniciar o prazo ou suspender seu direito.</span></div><div style="margin-top:16px"><span class="guide-badge-ok"><i class="fa-solid fa-check"></i> Você tem carteira de motorista!</span></div></div></div></div><div style="text-align:center;margin-top:10px"><button class="btn primary" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button></div></div></section>`}
function modulePage(index){const m=modules[index];if(!m){location.hash='inicio';return}if(Number(index)===1){location.hash='biblioteca';return}if(Number(index)===0){guideCNH();return}if(Number(index)===3){location.href='simulados.html';return}app.innerHTML=`<section class="subhero"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button><span>Início</span><i class="fa-solid fa-chevron-right"></i><span>${m[3]}</span></div><span class="eyebrow"><i class="fa-solid ${m[1]}"></i> ${m[2]}</span><h1>${m[3]}</h1><p>${m[4]}</p></div></section><section class="section"><div class="shell"><div class="module-panel" style="--accent:${m[0]}"><span class="icon"><i class="fa-solid ${m[1]}"></i></span><span class="soon">CONTEÚDO EM PREPARAÇÃO</span><h2>Este módulo terá sua própria área</h2><p>O espaço já está organizado dentro do sistema. Aqui poderão entrar aulas, orientações, exercícios e materiais específicos deste módulo sem alterar a página inicial.</p><button class="btn" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar aos módulos</button></div></div></section>`}
function library(){let total=totals();app.innerHTML=`<section class="subhero"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button><span>Área do aluno</span><i class="fa-solid fa-chevron-right"></i><span>Apostila</span></div><span class="eyebrow"><i class="fa-solid fa-book-open"></i> Apostila digital</span><h1>Matérias da apostila</h1><p>Escolha uma matéria para abrir diretamente suas páginas de leitura.</p><div class="stats"><span class="stat"><strong>${subjects.length}</strong> matérias</span><span class="stat"><strong>${total}</strong> páginas no total</span></div></div></section><section class="section"><div class="shell"><div class="section-head"><div><h2>Escolha uma matéria</h2><p>Acesse o conteúdo completo e navegue pelas páginas de leitura.</p></div><span class="pill">Leitura por matéria</span></div><div class="subjects">${subjects.map((s,i)=>`<article class="subject" data-subject="${s.slug}" style="--accent:${s.accent}"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="icon"><i class="fa-solid ${s.icon}"></i></span><h3>${s.title}</h3><p>${s.description}</p><div class="subject-meta"><span>${s.pages.length} páginas</span><span>Conteúdo completo</span></div><button type="button">Abrir matéria <i class="fa-solid fa-arrow-right"></i></button></article>`).join('')}</div></div></section>`;document.querySelectorAll('[data-subject]').forEach(b=>{let s=subjects.find(x=>x.slug===b.dataset.subject);b.onclick=()=>location.hash=`disciplina/${s.slug}/${s.pages[0].page}`})}
function cover(slug){let s=subjects.find(x=>x.slug===slug);if(!s){location.hash='biblioteca';return}let start=s.pages[0];app.innerHTML=`<section class="section"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash='biblioteca'"><i class="fa-solid fa-arrow-left"></i> Voltar às disciplinas</button></div><article class="subject-cover" style="--accent:${s.accent}"><div class="cover-inner"><div><span class="cover-kicker">Apostila digital · Disciplina ${subjects.indexOf(s)+1}</span><h1>${s.title}</h1><p>${s.description}</p><div class="stats"><span class="stat"><strong>${s.pages.length}</strong> páginas</span></div><div class="cover-actions"><button class="btn" data-start><i class="fa-solid fa-book-open"></i> Começar leitura</button><button class="btn outline" onclick="document.querySelector('.summary').scrollIntoView({behavior:'smooth'})"><i class="fa-solid fa-list"></i> Ver sumário</button></div></div><span class="cover-icon"><i class="fa-solid ${s.icon}"></i></span></div></article><section class="summary" style="--accent:${s.accent}"><div class="summary-head"><div><span class="cover-kicker" style="color:${s.accent}">Visão geral</span><h2>Sumário</h2></div><span>${s.pages.length} tópicos de estudo</span></div><div class="summary-list">${s.pages.map((p,i)=>`<button class="summary-item" data-page="${p.page}"><span class="summary-number">${i+1}</span><span>${topicTitle(p,i)}</span></button>`).join('')}</div></section></div></section>`;document.querySelector('[data-start]').onclick=()=>location.hash=`disciplina/${s.slug}/${start.page}`;bind(s);scrollTo({top:0,behavior:'smooth'})}
function items(s,current,q=''){q=q.trim().toLowerCase();let ps=s.pages.map((p,i)=>({p,i})).filter(x=>!q||x.p.text.toLowerCase().includes(q)||topicTitle(x.p,x.i).toLowerCase().includes(q));if(!ps.length)return'<div class="empty">Nenhum assunto encontrado.</div>';return ps.map(({p,i})=>`<button class="toc-item ${p.page===current?'active':''}" data-page="${p.page}"><span class="page-dot">${i+1}</span><span>${topicTitle(p,i)}</span></button>`).join('')}function bind(s){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>location.hash=`disciplina/${s.slug}/${b.dataset.page}`)}function chaptersFor(s){return(chapterPlan[s.slug]||[[s.title,0,s.pages.length]]).map((c,i)=>({title:c[0],start:c[1],end:c[2],count:c[2]-c[1],number:i+1}))}function chapterItems(s,currentPage,q=''){q=q.trim().toLowerCase();let currentIndex=s.pages.findIndex(p=>p.page===Number(currentPage)),list=chaptersFor(s).filter(c=>!q||c.title.toLowerCase().includes(q));if(!list.length)return'<div class="empty">Nenhum capítulo encontrado.</div>';return list.map(c=>`<button class="toc-item ${currentIndex>=c.start&&currentIndex<c.end?'active':''}" data-chapter-start="${c.start}"><span class="page-dot">${c.number}</span><span style="display:flex;min-width:0;flex-direction:column;gap:2px"><strong style="font-size:12px;line-height:1.35">${c.title}</strong><small style="color:#8a98aa;font-size:10px">${c.count} ${c.count===1?'página':'páginas'}</small></span></button>`).join('')}function bindChapters(s){document.querySelectorAll('[data-chapter-start]').forEach(b=>b.onclick=()=>location.hash=`disciplina/${s.slug}/${s.pages[Number(b.dataset.chapterStart)].page}`)}

<style>.psycho-content{max-width:1000px;margin:auto}.psycho-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;margin-bottom:20px;box-shadow:0 4px 12px #0f172a08}.psycho-card h2{font-size:22px;margin-bottom:12px}.psycho-card p,.psycho-card li{color:#455268;line-height:1.7}.psycho-card ul{padding-left:22px}.psycho-example{width:100%;display:block;border:1px solid var(--line);border-radius:14px;margin-top:16px}.psycho-note{padding:14px 16px;border-left:4px solid var(--gold);background:#fffbeb;color:#54451b;border-radius:0 10px 10px 0;font-size:13px}</style><script>function psychotestPage(){app.innerHTML='<section class="subhero"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash=\'inicio\'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button><span>Início</span><i class="fa-solid fa-chevron-right"></i><span>Psicoteste</span></div><span class="eyebrow"><i class="fa-solid fa-brain"></i> PREPARAÇÃO</span><h1>Psicoteste do Detran</h1><p>Entenda a avaliação psicológica e pratique habilidades importantes para dirigir com segurança.</p></div></section><section class="section"><div class="shell psycho-content"><article class="psycho-card"><h2>O que é avaliado?</h2><p>A avaliação psicológica, conhecida popularmente como psicoteste, verifica características importantes para a condução segura.</p><ul><li>Atenção concentrada e dividida;</li><li>Memória e percepção visual;</li><li>Raciocínio lógico;</li><li>Coordenação motora;</li><li>Controle emocional e tomada de decisões;</li><li>Comportamento e responsabilidade no trânsito.</li></ul></article><article class="psycho-card"><h2>Como se preparar</h2><ul><li>Durma bem e alimente-se normalmente;</li><li>Chegue com antecedência e leve documento oficial;</li><li>Preste atenção às instruções do psicólogo;</li><li>Faça os exercícios com calma, sem tentar adivinhar respostas;</li><li>Não é uma prova de legislação, placas ou direção.</li></ul><div class="psycho-note"><strong>Importante:</strong> o resultado depende da avaliação profissional. Os exercícios abaixo servem apenas para familiarização e treino.</div></article><article class="psycho-card"><h2>Exemplos de exercícios</h2><p>Veja alguns formatos de atividades que podem desenvolver atenção, memória, raciocínio e percepção visual.</p><img class="psycho-example" src="assets/psicoteste-exemplos.svg" alt="Infográfico com exemplos de treino de atenção, memória visual, raciocínio e percepção"></article><article class="psycho-card"><h2>Resultado e recurso</h2><p>Se o resultado for inapto, procure a clínica ou o Detran-BA para saber os prazos e procedimentos de nova avaliação ou recurso. As regras podem mudar, por isso confirme sempre nos canais oficiais.</p><button class="btn" onclick="location.hash=\'inicio\'"><i class="fa-solid fa-arrow-left"></i> Voltar aos módulos</button></article></div></section>'}const previousModulePage=modulePage;modulePage=function(index){if(Number(index)===2){psychotestPage();return}previousModulePage(index)}</script>
<style>.faq-content{max-width:950px;margin:auto}.faq-intro{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:20px}.faq-intro p{color:var(--muted);margin:8px 0 0}.faq-list{display:grid;gap:12px}.faq-item{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.faq-item summary{cursor:pointer;list-style:none;padding:18px 20px;font:800 15px Montserrat;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:15px}.faq-item summary::-webkit-details-marker{display:none}.faq-item summary:after{content:'+';font:800 22px Inter;color:var(--blue)}.faq-item[open] summary:after{content:'−'}.faq-answer{padding:0 20px 18px;color:#455268;line-height:1.7;font-size:14px}.faq-answer strong{color:var(--ink)}.faq-contact{margin-top:20px;background:#eef4ff;border:1px solid #cbdcff;border-radius:14px;padding:18px;color:#29476f;font-size:14px}</style><script>function faqPage(){const faqs=[['O que preciso fazer primeiro para tirar a CNH?','Inicie o processo no Detran-BA, faça o cadastro e siga as etapas indicadas: avaliação psicológica, exames, curso teórico, prova teórica, aulas práticas e prova prática. A ordem e os procedimentos devem ser confirmados no canal oficial do Detran.'],['O que é o psicoteste?','É a avaliação psicológica realizada por profissional credenciado. Ela pode avaliar atenção, memória, raciocínio, percepção, coordenação e controle emocional. Não é uma prova de legislação.'],['Como estudar para a prova teórica?','Use a apostila por disciplina, assista às videoaulas e faça os simulados. Estude um pouco todos os dias e revise os assuntos em que tiver mais dificuldade.'],['O que levar no dia da avaliação psicológica?','Leve documento oficial com foto, comprovante ou guia exigida pelo atendimento e chegue com antecedência. Confirme previamente com a clínica se há alguma exigência adicional.'],['O que acontece se eu não passar no psicoteste?','Procure a clínica ou o Detran-BA para saber o motivo registrado, os prazos e as regras para nova avaliação ou recurso. Não deixe de confirmar o procedimento oficial.'],['Como funciona a prova teórica?','A prova verifica o conteúdo estudado, incluindo legislação, sinalização, direção defensiva, primeiros socorros, cidadania, meio ambiente e mecânica. O formato e a quantidade de questões devem ser confirmados no Detran-BA.'],['Posso fazer simulados várias vezes?','Sim. Repetir os simulados ajuda a identificar os temas que precisam de revisão. O simulado é uma ferramenta de treino e não substitui a prova oficial.'],['Como são as aulas práticas?','Nas aulas práticas você aprende comandos, controle do veículo, circulação, estacionamento e os procedimentos cobrados no exame. Siga as orientações do instrutor e pratique com segurança.'],['Se eu reprovar, posso tentar novamente?','Em regra, existem procedimentos para refazer exames, mas os prazos, taxas e agendamentos devem ser confirmados diretamente com o Detran-BA ou com o instrutor.'],['Esta plataforma substitui o Detran ou a autoescola?','Não. Ela é uma plataforma de apoio disponibilizada aos alunos do Instrutor Micael Lucas. Para regras, taxas, documentos e agendamentos, consulte sempre o Detran-BA.']];app.innerHTML='<section class="subhero"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash=\'inicio\'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button><span>Início</span><i class="fa-solid fa-chevron-right"></i><span>Central de Dúvidas</span></div><span class="eyebrow"><i class="fa-solid fa-circle-question"></i> SUPORTE AO ALUNO</span><h1>Central de Dúvidas</h1><p>Encontre respostas rápidas para estudar e avançar no processo da sua habilitação.</p></div></section><section class="section"><div class="shell faq-content"><div class="faq-intro"><h2>Perguntas frequentes</h2><p>Abra uma pergunta para ver a resposta. Se sua dúvida não estiver aqui, fale diretamente com o Instrutor Micael Lucas.</p></div><div class="faq-list">'+faqs.map((f,i)=>'<details class="faq-item" '+(i===0?'open':'')+'><summary>'+f[0]+'</summary><div class="faq-answer">'+f[1]+'</div></details>').join('')+'</div><div class="faq-contact"><strong>Importante:</strong> informações sobre taxas, datas, documentos e procedimentos podem mudar. Confirme sempre no Detran-BA e nos canais oficiais.</div></div></section>'}const moduleBeforeFaq=modulePage;modulePage=function(index){if(Number(index)===5){faqPage();return}moduleBeforeFaq(index)}</script>

<script>
(function(){
  var sheet=document.getElementById('mmod-sheet'),backdrop=document.getElementById('mmod-backdrop'),modsBtn=document.getElementById('mnav-mods');
  function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open');modsBtn.classList.remove('active')}
  function toggleSheet(){var isOpen=sheet.classList.toggle('open');backdrop.classList.toggle('open',isOpen);modsBtn.classList.toggle('active',isOpen)}
  modsBtn.onclick=toggleSheet;
  backdrop.onclick=closeSheet;
  document.getElementById('mmod-close').onclick=closeSheet;
  document.querySelectorAll('[data-mgo]').forEach(function(b){
    b.onclick=function(){
      closeSheet();
      var t=b.dataset.mgo;
      if(t==='simulados')location.href='simulados.html';
      else location.hash=t;
    };
  });
  document.querySelectorAll('[data-mnav]').forEach(function(b){
    b.onclick=function(){
      closeSheet();
      var t=b.dataset.mnav;
      if(t==='simulados')location.href='simulados.html';
      else location.hash=t;
    };
  });
  document.getElementById('mnav-back').onclick=function(){
    closeSheet();
    var h=(location.hash||'#inicio').slice(1).split('/');
    if(h[0]==='disciplina')location.hash='biblioteca';
    else if(h[0]==='biblioteca'||h[0]==='videoaulas')location.hash='modulo/1';
    else if(h[0]&&h[0]!=='inicio')location.hash='inicio';
    else if(history.length>1)history.back();
    else scrollTo({top:0,behavior:'smooth'});
  };
  function syncActive(){
    closeSheet();
    var h=(location.hash||'#inicio').slice(1);
    document.querySelectorAll('[data-mnav]').forEach(function(b){
      var t=b.dataset.mnav;
      var isAct=(t==='inicio'&&(h===''||h==='inicio'))||(t==='modulo/1'&&(h==='modulo/1'||h==='biblioteca'||h==='videoaulas'||h.indexOf('disciplina/')===0));
      b.classList.toggle('active',isAct);
    });
  }
  addEventListener('hashchange',syncActive);
  syncActive();
})();
</script>
