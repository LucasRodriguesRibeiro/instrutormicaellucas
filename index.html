function totals(){return subjects.reduce((n,s)=>n+s.pages.length,0)}function esc(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function paras(t){let a=t.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[t],g=[],c='';a.forEach(s=>{if(c.length>480){g.push(c.trim());c=''}c+=s+' '});if(c.trim())g.push(c.trim());return g.map(p=>'<p>'+esc(p)+'</p>').join('')}function topicTitle(p,i){let h=p.text.split(/[.!?]/)[0].replace(/^Capítulo\s+\d+\s*-?\s*/i,'').trim().replace(/\s+/g,' ');if(h.length>78)h=h.slice(0,78).replace(/\s+\S*$/,'')+'…';return h.length>7?h:'Tópico '+(i+1)}
function home(){app.innerHTML=`<section class="hero"><div class="shell hero-inner"><span class="eyebrow"><i class="fa-solid fa-graduation-cap"></i> Plataforma teórica de apoio</span><h1>Plataforma de Estudos<br><span>Instrutor Micael Lucas</span></h1><p>Sua direção começa com confiança. Prepare-se com conteúdo organizado e avance no seu ritmo para a prova teórica.</p></div></section><section class="section"><div class="shell"><div class="section-head"><div><h2>Módulos do Sistema de Ensino</h2><p>Toque em um módulo para acessar conteúdos e orientações.</p></div><span class="pill">6 módulos disponíveis</span></div><div class="modules">${modules.map((m,i)=>`<article class="card ${i===1?'featured':''}" style="--accent:${m[0]}"><div class="card-top"><span class="icon"><i class="fa-solid ${m[1]}"></i></span><span class="tag">${m[2]}</span></div><h3>${m[3]}</h3><p>${m[4]}</p><div class="card-foot"><span><i class="fa-regular fa-clock"></i> ${i===1?'Leitura por disciplina':'Área do módulo'}</span><button class="card-action" data-module="${i}">Acessar módulo →</button></div></article>`).join('')}</div></div></section>`;document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>location.hash='modulo/'+b.dataset.module)}
function guideCNH(){app.innerHTML=`<section class="subhero"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button><span>Início</span><i class="fa-solid fa-chevron-right"></i><span>Guia Definitivo da CNH</span></div><span class="eyebrow"><i class="fa-solid fa-id-card"></i> PASSO A PASSO</span><h1>Guia Definitivo da CNH</h1><p>Tudo que você precisa saber sobre o processo da primeira habilitação, do início ao fim, de forma clara e sem enrolação.</p></div></section><section class="section"><div class="shell"><style>.guide-steps{display:flex;flex-direction:column;gap:0}.guide-step{display:grid;grid-template-columns:64px 1fr;gap:0 24px;position:relative}.guide-step:not(:last-child):before{content:'';position:absolute;left:31px;top:64px;bottom:0;width:2px;background:linear-gradient(var(--step-color,#2563eb),#e1e8f2);z-index:0}.guide-step-badge{width:64px;height:64px;border-radius:50%;background:var(--step-color,#2563eb);color:#fff;display:grid;place-items:center;font:800 22px Montserrat;flex-shrink:0;position:relative;z-index:1;box-shadow:0 4px 16px color-mix(in srgb,var(--step-color,#2563eb) 40%,transparent)}.guide-step-body{background:#fff;border:1px solid var(--line);border-left:4px solid var(--step-color,#2563eb);border-radius:0 16px 16px 0;padding:22px 26px;margin-bottom:28px}.guide-step-body h3{font:800 18px Montserrat;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:10px}.guide-step-body h3 i{color:var(--step-color,#2563eb)}.guide-step-body p{color:#455268;font-size:15px;line-height:1.7;margin:0 0 10px}.guide-step-body p:last-child{margin:0}.guide-tip{margin-top:14px;padding:12px 16px;border-radius:10px;background:color-mix(in srgb,var(--step-color,#2563eb) 9%,white);border:1px solid color-mix(in srgb,var(--step-color,#2563eb) 22%,white);font-size:13px;color:#3a4e6a;display:flex;gap:10px;align-items:flex-start}.guide-tip i{margin-top:2px;color:var(--step-color,#2563eb);flex-shrink:0}.guide-highlight{display:inline-block;background:var(--gold);color:#172033;border-radius:6px;padding:2px 8px;font-weight:800;font-size:14px}.guide-link{color:#2563eb;font-weight:700;text-decoration:underline}.guide-cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.guide-cat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#f9fbfd;font-size:13px;font-weight:700;color:#2c3e55;display:flex;align-items:center;gap:8px}.guide-cat i{color:var(--step-color,#2563eb)}.guide-badge-ok{display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#166534;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:800}@media(max-width:600px){.guide-step{grid-template-columns:44px 1fr}.guide-step-badge{width:44px;height:44px;font-size:16px}.guide-step:not(:last-child):before{left:21px;top:44px}}</style><div class="section-head"><div><h2>Como tirar sua CNH — Passo a Passo</h2><p>Siga cada etapa com atenção. Não pule nenhuma!</p></div><span class="pill">7 etapas</span></div><div class="guide-steps"><div class="guide-step" style="--step-color:#7c3aed"><div class="guide-step-badge">1</div><div class="guide-step-body"><h3><i class="fa-solid fa-mobile-screen-button"></i> Baixe o aplicativo CNH Digital Brasil</h3><p>O ponto de partida de tudo é o <strong>aplicativo CNH Digital Brasil</strong>, disponível gratuitamente para <strong>Android</strong> e <strong>iPhone</strong>.</p><p>Dentro do aplicativo você vai realizar o <strong>Curso Teórico Online</strong> — assista todas as aulas e ao concluir o próprio app emite o <strong>Certificado de Conclusão</strong>. Guarde esse certificado, ele será exigido no Detran.</p><div class="guide-tip"><i class="fa-solid fa-circle-info"></i><span>Você não precisa imprimir nada. O certificado fica salvo digitalmente no próprio aplicativo.</span></div></div></div><div class="guide-step" style="--step-color:#2563eb"><div class="guide-step-badge">2</div><div class="guide-step-body"><h3><i class="fa-solid fa-building-columns"></i> Vá ao Detran para iniciar o processo</h3><p>Com o curso concluído, dirija-se pessoalmente a um posto do <strong>Detran</strong> para dar início à sua primeira habilitação. Leve o celular com o aplicativo da CNH Digital Brasil para que eles possam <strong>identificar sua conclusão do curso</strong>.</p><p>No Detran você vai:</p><ul style="margin:8px 0 12px;padding-left:20px;color:#455268;font-size:15px;line-height:2"><li>Escolher a <strong>categoria</strong> desejada (veja abaixo)</li><li>Agendar o <strong>exame psicotécnico</strong> (eles já indicam a clínica credenciada)</li><li>Pagar a <strong>taxa inicial</strong></li></ul><div class="guide-cats"><div class="guide-cat"><i class="fa-solid fa-motorcycle"></i> Apenas <strong>A</strong> (moto)</div><div class="guide-cat"><i class="fa-solid fa-car-side"></i> Apenas <strong>B</strong> (carro)</div><div class="guide-cat"><i class="fa-solid fa-car-side"></i><i class="fa-solid fa-motorcycle"></i> <strong>AB</strong> (moto + carro)</div></div><div class="guide-tip"><i class="fa-solid fa-triangle-exclamation"></i><span>As categorias <strong>C, D e E</strong> (caminhão, ônibus, combinados) só podem ser tiradas depois que você já tiver a categoria <strong>B</strong>.</span></div><div class="guide-tip" style="margin-top:8px"><i class="fa-solid fa-circle-dollar-to-slot"></i><span>A taxa paga no Detran é em torno de <span class="guide-highlight">R$ 180</span>. Este valor pode ser reajustado — verifique o valor atual no balcão.</span></div></div></div><div class="guide-step" style="--step-color:#0891b2"><div class="guide-step-badge">3</div><div class="guide-step-body"><h3><i class="fa-solid fa-brain"></i> Faça o exame psicotécnico</h3><p>No dia agendado, compareça à clínica indicada pelo Detran para realizar o <strong>exame psicotécnico</strong> (avaliação psicológica).</p><p>O resultado sai em até <span class="guide-highlight">7 dias</span>. Se não passar, fique tranquilo: você tem direito a um <strong>reteste gratuito</strong> — e muitas vezes o reteste é apenas na atividade em que você teve dificuldade.</p><div class="guide-tip"><i class="fa-solid fa-lightbulb"></i><span>Não é difícil. O segredo é <strong>prestar atenção</strong> durante as atividades e não se apressar. Respire fundo e vá com calma.</span></div></div></div><div class="guide-step" style="--step-color:#059669"><div class="guide-step-badge">4</div><div class="guide-step-body"><h3><i class="fa-solid fa-file-pen"></i> Estude e agende a prova teórica</h3><p>Com o psicotécnico aprovado, o próximo passo é a <strong>prova teórica</strong>. Esta plataforma tem o <strong>conteúdo completo</strong> organizado e simulados para você se preparar com segurança.</p><p>O agendamento é feito pelo site oficial do Detran-BA:</p><a class="guide-link" href="https://servicos.detran.ba.gov.br/" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> servicos.detran.ba.gov.br</a><div class="guide-tip" style="margin-top:14px"><i class="fa-solid fa-calendar-clock"></i><span>Agende assim que o resultado do psicotécnico aparecer no aplicativo CNH Digital Brasil. Com a alta demanda, a data mais próxima costuma ter no mínimo <strong>20 dias de espera</strong> — não deixe para última hora.</span></div></div></div><div class="guide-step" style="--step-color:#f59e0b"><div class="guide-step-badge">5</div><div class="guide-step-body"><h3><i class="fa-solid fa-car"></i> Aulas práticas com o Instrutor Micael Lucas</h3><p>Aprovado na teórica, chegou a hora das <strong>aulas práticas</strong>! O Instrutor Micael Lucas vai te guiar em tudo, do zero à aprovação.</p><p>Não sabe dirigir ainda? <strong>Sem problema</strong> — ele te ensina do absoluto início e te deixa pronto para enfrentar a prova com confiança.</p><ul style="margin:8px 0 12px;padding-left:20px;color:#455268;font-size:15px;line-height:2"><li>O mesmo <strong>carro e moto</strong> que você treina é o que você usa na prova</li><li>O instrutor <strong>vai com você</strong> no dia da prova prática</li><li>As provas práticas acontecem toda <strong>terça-feira</strong></li><li>Só é possível fazer <strong>um veículo por vez</strong> (moto ou carro)</li></ul><div class="guide-tip"><i class="fa-solid fa-star"></i><span>Você entra na prova conhecendo o veículo, o instrutor e o percurso — isso faz toda a diferença!</span></div></div></div><div class="guide-step" style="--step-color:#e11d48"><div class="guide-step-badge">6</div><div class="guide-step-body"><h3><i class="fa-solid fa-flag-checkered"></i> Prova prática — é a reta final!</h3><p>Com as aulas concluídas, você está pronto para a <strong>prova prática</strong>. Lembre-se: as provas são realizadas todas as <strong>terças-feiras</strong> e você faz <strong>um veículo por vez</strong>.</p><p>Se tiver feito a categoria AB, primeiro você faz a prova de um veículo e, depois de aprovado, agenda a prova do outro.</p><div class="guide-tip"><i class="fa-solid fa-check-circle"></i><span>O Instrutor Micael Lucas acompanha você até o final. Confie no treino — você chega preparado!</span></div></div></div><div class="guide-step" style="--step-color:#4f46e5"><div class="guide-step-badge">7</div><div class="guide-step-body"><h3><i class="fa-solid fa-id-card"></i> PPD e CNH definitiva — missão cumprida!</h3><p>Concluídas todas as etapas, você receberá a <strong>PPD (Permissão Para Dirigir)</strong>. Você fica com ela por <span class="guide-highlight">1 ano</span> dirigindo sem infrações graves.</p><p>Após esse período, sem pendências, sua <strong>CNH definitiva</strong> é emitida automaticamente.</p><div class="guide-tip"><i class="fa-solid fa-shield-halved"></i><span>Durante o ano da PPD, dirija com responsabilidade — qualquer infração grave pode reiniciar o prazo ou suspender seu direito.</span></div><div style="margin-top:16px"><span class="guide-badge-ok"><i class="fa-solid fa-check"></i> Você tem carteira de motorista!</span></div></div></div></div><div style="text-align:center;margin-top:10px"><button class="btn primary" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button></div></div></section>`}
function simulados(){app.innerHTML=`<section class="subhero"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button><span>Início</span><i class="fa-solid fa-chevron-right"></i><span>Simulados</span></div><span class="eyebrow"><i class="fa-solid fa-clipboard-check"></i> TESTE REAL</span><h1>Simulados Oficiais Detran</h1><p>Escolha um simulado por matéria ou treine com o simulado completo misturando todas as disciplinas — assim como na prova de verdade.</p></div></section><section class="section"><div class="shell"><style>.sim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:8px}.sim-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;box-shadow:0 4px 12px #0f172a08;transition:.2s;cursor:pointer;border-top:5px solid var(--sc,#2563eb)}.sim-card:hover{transform:translateY(-3px);box-shadow:0 18px 45px #0f234117}.sim-card .icon{width:50px;height:50px;border-radius:14px;background:color-mix(in srgb,var(--sc,#2563eb) 13%,white);display:grid;place-items:center;font-size:20px;color:var(--sc,#2563eb)}.sim-card h3{font:800 16px/1.3 Montserrat;color:var(--ink);margin:0}.sim-card p{color:var(--muted);font-size:13px;margin:0;line-height:1.5}.sim-card .sim-badge{margin-top:auto;display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--sc,#2563eb) 10%,white);color:var(--sc,#2563eb);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:800}.sim-full{grid-column:1/-1;background:linear-gradient(120deg,#07172f,#102f5d);color:#fff;border-top-color:var(--gold)}.sim-full .icon{background:#ffffff18;color:var(--gold)}.sim-full h3{color:#fff;font-size:20px}.sim-full p{color:#bdc9da}.sim-full .sim-badge{background:var(--gold);color:#172033}.sim-soon{opacity:.7;cursor:not-allowed}.sim-soon:hover{transform:none;box-shadow:0 4px 12px #0f172a08}@media(max-width:900px){.sim-grid{grid-template-columns:repeat(2,1fr)}.sim-full{grid-column:1/-1}}@media(max-width:600px){.sim-grid{grid-template-columns:1fr}}</style><div class="section-head"><div><h2>Escolha seu simulado</h2><p>Treine por matéria ou no formato completo da prova.</p></div><span class="pill">7 simulados</span></div><div class="sim-grid"><div class="sim-card sim-full" style="--sc:#f7bd2f;cursor:pointer" onclick="location.hash='simulado/completo'"><span class="icon"><i class="fa-solid fa-star"></i></span><h3>Simulado Completo</h3><p>30 questões · 60 minutos · Mistura todas as matérias no formato da prova oficial do Detran. O treino mais completo que você pode fazer.</p><span class="sim-badge"><i class="fa-solid fa-play"></i> Iniciar simulado</span></div><div class="sim-card sim-soon" style="--sc:#2563eb"><span class="icon"><i class="fa-solid fa-scale-balanced"></i></span><h3>Legislação de Trânsito</h3><p>CTB, infrações, penalidades, habilitação e sinalização.</p><span class="sim-badge"><i class="fa-solid fa-clock"></i> Em breve</span></div><div class="sim-card sim-soon" style="--sc:#7c3aed"><span class="icon"><i class="fa-solid fa-shield-halved"></i></span><h3>Direção Defensiva</h3><p>Princípios, condições adversas, atenção e prevenção de acidentes.</p><span class="sim-badge"><i class="fa-solid fa-clock"></i> Em breve</span></div><div class="sim-card sim-soon" style="--sc:#e11d48"><span class="icon"><i class="fa-solid fa-kit-medical"></i></span><h3>Primeiros Socorros</h3><p>Procedimentos, sinalização do acidente e atendimento à vítima.</p><span class="sim-badge"><i class="fa-solid fa-clock"></i> Em breve</span></div><div class="sim-card sim-soon" style="--sc:#0891b2"><span class="icon"><i class="fa-solid fa-people-group"></i></span><h3>Cidadania no Trânsito</h3><p>Direitos, deveres, educação e convivência no ambiente viário.</p><span class="sim-badge"><i class="fa-solid fa-clock"></i> Em breve</span></div><div class="sim-card sim-soon" style="--sc:#059669"><span class="icon"><i class="fa-solid fa-leaf"></i></span><h3>Meio Ambiente</h3><p>Poluição, emissões, sustentabilidade e responsabilidade ambiental.</p><span class="sim-badge"><i class="fa-solid fa-clock"></i> Em breve</span></div><div class="sim-card sim-soon" style="--sc:#f59e0b"><span class="icon"><i class="fa-solid fa-gear"></i></span><h3>Mecânica Básica</h3><p>Manutenção, freios, pneus, suspensão e itens obrigatórios.</p><span class="sim-badge"><i class="fa-solid fa-clock"></i> Em breve</span></div></div><div style="text-align:center;margin-top:32px"><button class="btn primary" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button></div></div></section>`;scrollTo({top:0,behavior:'smooth'})}
function modulePage(index){const m=modules[index];if(!m){location.hash='inicio';return}if(Number(index)===1){location.hash='biblioteca';return}if(Number(index)===0){guideCNH();return}if(Number(index)===3){location.hash='simulados';return}app.innerHTML=`<section class="subhero"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button><span>Início</span><i class="fa-solid fa-chevron-right"></i><span>${m[3]}</span></div><span class="eyebrow"><i class="fa-solid ${m[1]}"></i> ${m[2]}</span><h1>${m[3]}</h1><p>${m[4]}</p></div></section><section class="section"><div class="shell"><div class="module-panel" style="--accent:${m[0]}"><span class="icon"><i class="fa-solid ${m[1]}"></i></span><span class="soon">CONTEÚDO EM PREPARAÇÃO</span><h2>Este módulo terá sua própria área</h2><p>O espaço já está organizado dentro do sistema. Aqui poderão entrar aulas, orientações, exercícios e materiais específicos deste módulo sem alterar a página inicial.</p><button class="btn" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar aos módulos</button></div></div></section>`}
function library(){let total=totals();app.innerHTML=`<section class="subhero"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash='inicio'"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</button><span>Área do aluno</span><i class="fa-solid fa-chevron-right"></i><span>Apostila</span></div><span class="eyebrow"><i class="fa-solid fa-book-open"></i> Apostila digital</span><h1>Matérias da apostila</h1><p>Escolha uma matéria para abrir diretamente suas páginas de leitura.</p><div class="stats"><span class="stat"><strong>${subjects.length}</strong> matérias</span><span class="stat"><strong>${total}</strong> páginas no total</span></div></div></section><section class="section"><div class="shell"><div class="section-head"><div><h2>Escolha uma matéria</h2><p>Acesse o conteúdo completo e navegue pelas páginas de leitura.</p></div><span class="pill">Leitura por matéria</span></div><div class="subjects">${subjects.map((s,i)=>`<article class="subject" style="--accent:${s.accent}"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="icon"><i class="fa-solid ${s.icon}"></i></span><h3>${s.title}</h3><p>${s.description}</p><div class="subject-meta"><span>${s.pages.length} páginas</span><span>Conteúdo completo</span></div><button data-subject="${s.slug}">Abrir matéria <i class="fa-solid fa-arrow-right"></i></button></article>`).join('')}</div></div></section>`;document.querySelectorAll('[data-subject]').forEach(b=>{let s=subjects.find(x=>x.slug===b.dataset.subject);b.onclick=()=>location.hash=`disciplina/${s.slug}/${s.pages[0].page}`})}
function cover(slug){let s=subjects.find(x=>x.slug===slug);if(!s){location.hash='biblioteca';return}let start=s.pages[0];app.innerHTML=`<section class="section"><div class="shell"><div class="breadcrumb"><button class="back-btn" onclick="location.hash='biblioteca'"><i class="fa-solid fa-arrow-left"></i> Voltar às disciplinas</button></div><article class="subject-cover" style="--accent:${s.accent}"><div class="cover-inner"><div><span class="cover-kicker">Apostila digital · Disciplina ${subjects.indexOf(s)+1}</span><h1>${s.title}</h1><p>${s.description}</p><div class="stats"><span class="stat"><strong>${s.pages.length}</strong> páginas</span></div><div class="cover-actions"><button class="btn" data-start><i class="fa-solid fa-book-open"></i> Começar leitura</button><button class="btn outline" onclick="document.querySelector('.summary').scrollIntoView({behavior:'smooth'})"><i class="fa-solid fa-list"></i> Ver sumário</button></div></div><span class="cover-icon"><i class="fa-solid ${s.icon}"></i></span></div></article><section class="summary" style="--accent:${s.accent}"><div class="summary-head"><div><span class="cover-kicker" style="color:${s.accent}">Visão geral</span><h2>Sumário</h2></div><span>${s.pages.length} tópicos de estudo</span></div><div class="summary-list">${s.pages.map((p,i)=>`<button class="summary-item" data-page="${p.page}"><span class="summary-number">${i+1}</span><span>${topicTitle(p,i)}</span></button>`).join('')}</div></section></div></section>`;document.querySelector('[data-start]').onclick=()=>location.hash=`disciplina/${s.slug}/${start.page}`;bind(s);scrollTo({top:0,behavior:'smooth'})}
function items(s,current,q=''){q=q.trim().toLowerCase();let ps=s.pages.map((p,i)=>({p,i})).filter(x=>!q||x.p.text.toLowerCase().includes(q)||topicTitle(x.p,x.i).toLowerCase().includes(q));if(!ps.length)return'<div class="empty">Nenhum assunto encontrado.</div>';return ps.map(({p,i})=>`<button class="toc-item ${p.page===current?'active':''}" data-page="${p.page}"><span class="page-dot">${i+1}</span><span>${topicTitle(p,i)}</span></button>`).join('')}function bind(s){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>location.hash=`disciplina/${s.slug}/${b.dataset.page}`)}function chaptersFor(s){return(chapterPlan[s.slug]||[[s.title,0,s.pages.length]]).map((c,i)=>({title:c[0],start:c[1],end:c[2],count:c[2]-c[1],number:i+1}))}function chapterItems(s,currentPage,q=''){q=q.trim().toLowerCase();let currentIndex=s.pages.findIndex(p=>p.page===Number(currentPage)),list=chaptersFor(s).filter(c=>!q||c.title.toLowerCase().includes(q));if(!list.length)return'<div class="empty">Nenhum capítulo encontrado.</div>';return list.map(c=>`<button class="toc-item ${currentIndex>=c.start&&currentIndex<c.end?'active':''}" data-chapter-start="${c.start}"><span class="page-dot">${c.number}</span><span style="display:flex;min-width:0;flex-direction:column;gap:2px"><strong style="font-size:12px;line-height:1.35">${c.title}</strong><small style="color:#8a98aa;font-size:10px">${c.count} ${c.count===1?'página':'páginas'}</small></span></button>`).join('')}function bindChapters(s){document.querySelectorAll('[data-chapter-start]').forEach(b=>b.onclick=()=>location.hash=`disciplina/${s.slug}/${s.pages[Number(b.dataset.chapterStart)].page}`)}
function reader(slug,requested){let s=subjects.find(x=>x.slug===slug);if(!s){location.hash='biblioteca';return}let i=s.pages.findIndex(p=>p.page===Number(requested));if(i<0)i=0;let p=s.pages[i],chapters=chaptersFor(s),chapter=chapters.find(c=>i>=c.start&&i<c.end)||chapters[0],chapterPage=i-chapter.start+1,isChapterStart=i===chapter.start,bodyText=p.text;if(i===0){bodyText=bodyText.replace(/^Capítulo\s+\d+\s*-\s*/i,'');if(bodyText.startsWith(s.title))bodyText=bodyText.slice(s.title.length).trim()}app.innerHTML=`<section class="reader"><div class="reader-head"><div class="shell reader-head-row"><div><span class="reader-kicker">Apostila digital</span><h1>${s.title}</h1></div><div class="reader-actions"><button class="back-btn" onclick="location.hash='biblioteca'"><i class="fa-solid fa-arrow-left"></i> Voltar às matérias</button></div></div></div><div class="shell reader-layout"><aside class="toc"><div class="toc-head"><div class="toc-title"><span>Capítulos da matéria</span><span>${chapters.length} capítulos</span></div><input class="search" id="search" type="search" placeholder="Buscar capítulo..."></div><div class="toc-list" id="toc">${chapterItems(s,p.page)}</div></aside><article class="reading-column"><div class="paper ${isChapterStart?'chapter-opening':'continuation'}" style="--accent:${s.accent}">${isChapterStart?`<span class="paper-label">Capítulo ${chapter.number}</span><h2>${chapter.title}</h2>`:''}<div class="paper-content">${isChapterStart?renderStudyAid(s,chapter):''}${paras(bodyText)}</div></div><div class="reader-nav"><button class="nav-btn" id="prev" ${i===0?'disabled':''}><i class="fa-solid fa-arrow-left"></i> Página anterior</button><span class="page-count">Página ${chapterPage} de ${chapter.count}</span><button class="nav-btn next" id="next" ${i===s.pages.length-1?'disabled':''}>Próxima página <i class="fa-solid fa-arrow-right"></i></button></div></article></div></section>`;prev.onclick=()=>go(s,i-1);next.onclick=()=>go(s,i+1);search.oninput=e=>{toc.innerHTML=chapterItems(s,p.page,e.target.value);bindChapters(s)};bindChapters(s);scrollTo({top:0,behavior:'smooth'})}function go(s,i){if(i>=0&&i<s.pages.length)location.hash=`disciplina/${s.slug}/${s.pages[i].page}`}
function router(){let r=(location.hash||'#inicio').slice(1).split('/');if(r[0]==='biblioteca')library();else if(r[0]==='simulados')simulados();else if(r[0]==='simulado'&&r[1]==='completo')simuladoCompleto();else if(r[0]==='disciplina')reader(r[1],r[2]);else if(r[0]==='modulo')modulePage(Number(r[1]));else home()}addEventListener('hashchange',router);router();
</script>

<script>
var questoesCompleto=[

{n:2,mat:'Legislação',txt:'O uso do cinto de segurança é obrigatório:',ops:['A) Apenas em rodovias federais','B) Apenas para o motorista em vias urbanas','C) Em todas as vias públicas, para todos os ocupantes do veículo','D) Somente à noite e em rodovias'],ok:2},
{n:3,mat:'Legislação',txt:'Qual é a validade da CNH para condutores com menos de 50 anos de idade?',ops:['A) 3 anos','B) 5 anos','C) 8 anos','D) 10 anos'],ok:1},
{n:4,mat:'Legislação',txt:'A faixa de pedestre sinalizada no leito carroçável garante ao pedestre:',ops:['A) Preferência de passagem sobre os veículos','B) Travessia somente com semáforo de pedestre verde','C) Autorização para cruzar em qualquer ponto da via','D) Proteção apenas em horário comercial'],ok:0},
{n:5,mat:'Legislação',txt:'A categoria "B" da CNH habilita o condutor para veículos com peso bruto total de até:',ops:['A) 2.500 kg','B) 3.000 kg','C) 3.500 kg','D) 4.500 kg'],ok:2},
{n:6,mat:'Legislação',txt:'A ultrapassagem é PROIBIDA:',ops:['A) Em vias expressas durante o dia','B) Nas proximidades de curvas ou aclives com visibilidade reduzida','C) Em vias de mão dupla com limite de velocidade de 80 km/h','D) Somente à noite em vias urbanas'],ok:1},

function simuladoCompleto(){
var resp=new Array(questoesCompleto.length).fill(null);
var atual=0;var seg=3600;var tid=null;
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function rq(){
var q=questoesCompleto[atual];
var feitas=resp.filter(function(r){return r!==null;}).length;
document.getElementById('sqa').innerHTML=
'<div class="sim-q-meta"><span class="sim-q-label">Questão '+(atual+1)+' de '+questoesCompleto.length+'</span><span class="sim-q-mat">'+q.mat+'</span></div>'+
'<p class="sim-q-txt">'+q.txt+'</p>'+
'<div class="sim-ops">'+q.ops.map(function(op,i){return '<button class="sim-op'+(resp[atual]===i?' selected':'')+'" data-i="'+i+'">'+op+'</button>';}).join('')+'</div>'+
'<div class="sim-nav">'+
'<button class="sim-nav-btn" id="sp"'+(atual===0?' disabled':'')+'>&#8592; Anterior</button>'+
'<button class="sim-skip">Pular &#8594;</button>'+
'<button class="sim-nav-btn snext" id="sn"'+(atual===questoesCompleto.length-1?' disabled':'')+'>Próxima &#8594;</button>'+
'</div>';
document.getElementById('spg').textContent=feitas+'/'+questoesCompleto.length+' respondidas';
document.getElementById('sgd').innerHTML=questoesCompleto.map(function(_,i){
var c='sim-q-btn';if(i===atual)c+=' sqcur';if(resp[i]!==null)c+=' sqok';
return '<button class="'+c+'" data-q="'+i+'">'+(i+1)+'</button>';
}).join('');
document.querySelectorAll('.sim-op').forEach(function(b){b.onclick=function(){resp[atual]=parseInt(b.dataset.i);rq();};});
document.querySelectorAll('#sgd .sim-q-btn').forEach(function(b){b.onclick=function(){atual=parseInt(b.dataset.q);rq();};});
var sp=document.getElementById('sp'),sn=document.getElementById('sn');
if(sp)sp.onclick=function(){if(atual>0){atual--;rq();}};
if(sn)sn.onclick=function(){if(atual<questoesCompleto.length-1){atual++;rq();}};
var sk=document.querySelector('#sqa .sim-skip');
if(sk)sk.onclick=function(){
var nx=-1;
for(var i=atual+1;i<questoesCompleto.length;i++){if(resp[i]===null){nx=i;break;}}
if(nx===-1){for(var j=0;j<atual;j++){if(resp[j]===null){nx=j;break;}}}
if(nx!==-1){atual=nx;rq();}else{alert('Todas as questões já foram respondidas!');}
};
}
function resultado(){
clearInterval(tid);
var certas=resp.filter(function(r,i){return r===questoesCompleto[i].ok;}).length;
var ap=certas>=21;var pct=Math.round(certas/questoesCompleto.length*100);
app.innerHTML='<section class="section"><div class="sim-result"><div class="sim-res-card">'+
'<span class="eyebrow"><i class="fa-solid fa-clipboard-check"></i> Resultado do Simulado</span>'+
'<div class="sim-res-score '+(ap?'sok':'snok')+'">'+certas+'/'+questoesCompleto.length+'</div>'+
'<span class="sim-res-badge '+(ap?'sok':'snok')+'"><i class="fa-solid fa-'+(ap?'check':'xmark')+'"></i> '+(ap?'APROVADO — Bom trabalho!':'REPROVADO — Continue estudando!')+'</span>'+
'<div class="sim-res-stats">'+
'<div class="sim-stat"><strong style="color:#059669">'+certas+'</strong><span>Acertos</span></div>'+
'<div class="sim-stat"><strong style="color:#e11d48">'+(questoesCompleto.length-certas)+'</strong><span>Erros</span></div>'+
'<div class="sim-stat"><strong>'+pct+'%</strong><span>Aproveitamento</span></div>'+
'</div>'+
'<p style="color:var(--muted);font-size:14px;margin:0 0 24px">Na prova oficial do Detran, o mínimo para aprovação é <strong>21 acertos (70%)</strong> em 30 questões.</p>'+
'<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:36px">'+
'<button class="btn primary" onclick="location.hash=\'simulado/completo\'"><i class="fa-solid fa-rotate-right"></i> Refazer simulado</button>'+
'<button class="btn" style="background:var(--navy);color:#fff;border-color:var(--navy)" onclick="location.hash=\'simulados\'"><i class="fa-solid fa-arrow-left"></i> Outros simulados</button>'+
'</div>'+
'<div class="sim-review"><h3><i class="fa-solid fa-list-check"></i> Revisão completa das questões</h3>'+
questoesCompleto.map(function(q,i){
var r=resp[i];var ac=r===q.ok;
return '<div class="sim-r-item '+(ac?'rok':'rnok')+'">'+
'<p><strong>Q'+(i+1)+'</strong> <span style="font-size:12px;color:var(--muted)">('+q.mat+')</span> — '+q.txt+'</p>'+
(r!==null?'<p class="rans '+(ac?'rok':'rnok')+'"><i class="fa-solid fa-'+(ac?'check':'xmark')+'"></i> Sua resposta: '+q.ops[r]+'</p>':'<p class="rans rnok"><i class="fa-solid fa-clock"></i> Não respondida</p>')+
(!ac?'<p class="rcor"><i class="fa-solid fa-check"></i> Resposta correta: '+q.ops[q.ok]+'</p>':'')+
'</div>';
}).join('')+
'</div></div></div></section>';
scrollTo({top:0,behavior:'smooth'});
}
app.innerHTML=
'<header class="sim-hdr"><div class="sim-hdr-inner">'+
'<button class="back-btn" id="sexit"><i class="fa-solid fa-arrow-left"></i> Sair</button>'+
'<span class="sim-title"><i class="fa-solid fa-clipboard-check"></i> Simulado Completo &nbsp;·&nbsp; 30 questões</span>'+
'<div class="sim-timer-box"><i class="fa-solid fa-clock"></i><span class="sim-clock" id="sclock">60:00</span></div>'+
'</div></header>'+
'<div class="sim-body">'+
'<div class="sim-q-card" id="sqa"></div>'+
'<aside class="sim-side">'+
'<div class="sim-side-card">'+
'<div class="sim-side-head"><span class="sim-side-title">Questões</span><span class="sim-side-prog" id="spg">0/30 respondidas</span></div>'+
'<div class="sim-q-grid" id="sgd"></div>'+
'<p class="sim-side-legend">'+
'<span style="display:inline-block;width:13px;height:13px;background:#d1fae5;border:2px solid #059669;border-radius:3px;vertical-align:middle"></span> <b>Verde</b> = respondida &nbsp;'+
'<span style="display:inline-block;width:13px;height:13px;background:#2563eb;border-radius:3px;vertical-align:middle"></span> <b>Azul</b> = atual<br>'+
'Clique em qualquer número para ir direto a ele.<br>'+
'Você pode pular e voltar depois — na prova real esta legenda não aparece.</p>'+
'</div>'+
'<button class="sim-finish-btn" id="sfinish"><i class="fa-solid fa-flag-checkered"></i> Finalizar prova</button>'+
'</aside>'+
'</div>';
tid=setInterval(function(){
seg--;var el=document.getElementById('sclock');
if(el){el.textContent=fmt(seg);if(seg<=300)el.classList.add('urgente');}
if(seg<=0){clearInterval(tid);resultado();}
},1000);
document.getElementById('sexit').onclick=function(){
if(confirm('Deseja sair do simulado? Seu progresso será perdido.')){clearInterval(tid);location.hash='simulados';}
};
document.getElementById('sfinish').onclick=function(){
var nao=resp.filter(function(r){return r===null;}).length;
if(nao>0&&!confirm('Você ainda tem '+nao+' questão(ões) sem resposta. Deseja finalizar mesmo assim?'))return;
resultado();
};
rq();scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
