<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plataforma de Estudos | Instrutor Micael Lucas</title>
  <meta name="description" content="Biblioteca teórica para a primeira habilitação, organizada por disciplina.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root{--navy:#08162b;--gold:#fbbf24;--blue:#2563eb;--ink:#111b31;--muted:#61708a;--line:#e2e8f0;--bg:#f5f7fb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Inter,sans-serif}button,input{font:inherit}button,a{cursor:pointer}a{text-decoration:none;color:inherit}h1,h2,h3,h4{font-family:Montserrat,sans-serif;line-height:1.18;margin:0}.shell{width:min(1180px,calc(100% - 40px));margin:auto}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(8,22,43,.96);border-bottom:1px solid #243651;color:#fff;backdrop-filter:blur(12px)}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:44px;height:44px;border:1px solid rgba(251,191,36,.48);border-radius:13px;display:grid;place-items:center;color:var(--gold);background:#071326}.brand small{display:block;color:#aebbd0;font-weight:700;letter-spacing:.08em}.brand strong{font:800 19px Montserrat}.credential{display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid rgba(251,191,36,.45);border-radius:999px;color:#dce4ef;font-weight:700;font-size:12px}.credential i{color:var(--gold)}
    .hero{background:radial-gradient(circle at 80% 20%,rgba(37,99,235,.23),transparent 44%),linear-gradient(120deg,#0a172b,#0a2147);color:#fff;padding:78px 0 90px}.hero-inner{text-align:center;max-width:820px;margin:auto}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.35);color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.hero h1{font-size:clamp(36px,5vw,58px);margin:22px 0 16px}.hero h1 span{color:var(--gold)}.hero p{max-width:700px;margin:auto;color:#bdc8da;font-size:18px}
    .section{padding:65px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:30px}.section-head h2{font-size:28px}.section-head p{color:var(--muted);margin:7px 0 0}.section-title{display:flex;gap:12px;align-items:center}.section-title>i{color:var(--blue);font-size:25px}.pill{background:var(--blue);color:#fff;border-radius:99px;padding:8px 14px;font-size:12px;font-weight:800}
    .modules{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;min-height:260px;flex-direction:column;box-shadow:0 4px 12px rgba(15,23,42,.035);transition:.22s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 35px rgba(15,23,42,.09)}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.icon{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:var(--accent,#2563eb);color:#fff;font-size:20px}.tag{border:1px solid color-mix(in srgb,var(--accent,#2563eb) 25%,white);background:color-mix(in srgb,var(--accent,#2563eb) 7%,white);color:var(--accent,#2563eb);border-radius:99px;padding:5px 10px;font-size:10px;font-weight:800;letter-spacing:.06em}.card h3{font-size:19px}.card p{color:var(--muted);font-size:14px;margin:10px 0 20px}.card-foot{margin-top:auto;border-top:1px solid #eef2f7;padding-top:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;color:#96a3b8;font-size:12px}.card-action{border:0;background:none;color:var(--blue);font-weight:800;padding:0}.card.featured{border-color:#f3d47b;background:linear-gradient(160deg,#fff,#fffcf3)}
    .library-hero{background:var(--navy);color:#fff;padding:48px 0}.crumb{display:flex;gap:9px;align-items:center;color:#94a3b8;font-size:13px;margin-bottom:24px}.crumb button{border:0;background:none;color:#cbd5e1;padding:0}.library-hero h1{font-size:clamp(30px,4vw,44px);margin:13px 0}.library-hero p{color:#bac6d9;max-width:680px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.stat{background:#132746;border:1px solid #29415f;padding:9px 13px;border-radius:10px;color:#d9e2ef;font-size:13px}.stat strong{color:var(--gold)}
    .subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.subject{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;transition:.2s;position:relative;overflow:hidden}.subject:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}.subject:hover{transform:translateY(-3px);box-shadow:0 15px 30px rgba(15,23,42,.08)}.subject .icon{margin-bottom:20px}.subject h3{font-size:19px}.subject p{color:var(--muted);font-size:13px;min-height:63px}.progress-track{height:7px;border-radius:99px;background:#edf1f7;overflow:hidden;margin:18px 0 8px}.progress-fill{height:100%;background:var(--accent);border-radius:inherit}.subject-meta{display:flex;justify-content:space-between;color:#8290a6;font-size:11px;font-weight:700}.subject button{width:100%;margin-top:18px;border:0;border-radius:10px;padding:11px;background:var(--navy);color:#fff;font-weight:800}.subject button:hover{background:var(--blue)}
    .reader{min-height:calc(100vh - 76px)}.reader-top{background:var(--navy);color:#fff;padding:28px 0}.reader-top-row{display:flex;justify-content:space-between;align-items:center;gap:20px}.reader-top h1{font-size:24px;margin-top:5px}.reader-progress{min-width:230px;text-align:right;font-size:12px;color:#b9c5d7}.reader-progress .progress-track{background:#2b3d57;margin:8px 0 0}.reader-progress .progress-fill{background:var(--gold)}
    .reader-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:30px;padding:34px 0 70px}.toc{position:sticky;top:108px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;max-height:calc(100vh - 130px);display:flex;flex-direction:column}.toc-head{padding:16px;border-bottom:1px solid var(--line)}.search{width:100%;border:1px solid #d8e0eb;border-radius:10px;padding:10px 12px;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dbeafe}.toc-list{overflow:auto;padding:8px}.toc-item{width:100%;border:0;background:none;border-radius:9px;padding:10px;text-align:left;display:flex;gap:10px;align-items:center;color:#58677e;font-size:12px}.toc-item:hover{background:#f1f5f9}.toc-item.active{background:#eaf1ff;color:#1d4ed8;font-weight:800}.toc-item.done .page-dot{background:#16a34a;color:#fff}.page-dot{width:27px;height:27px;flex:0 0 27px;border-radius:8px;background:#eef2f7;display:grid;place-items:center;font-size:10px}
    .paper{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px rgba(15,23,42,.06);padding:clamp(26px,5vw,58px);min-height:700px}.paper-label{color:var(--blue);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.paper h2{font-size:clamp(26px,4vw,38px);margin:10px 0 28px;padding-bottom:22px;border-bottom:1px solid var(--line)}.paper-content{font-family:Georgia,serif;font-size:18px;line-height:1.9;color:#263247}.paper-content p{margin:0 0 1.35em}.paper-content p:first-child:first-letter{float:left;font:700 58px/45px Montserrat;margin:8px 9px 0 0;color:var(--blue)}.reader-nav{display:flex;justify-content:space-between;gap:14px;margin-top:32px}.nav-btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 16px;font-weight:800;color:#263247}.nav-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.nav-btn:disabled{opacity:.35;cursor:not-allowed}.empty{padding:25px;text-align:center;color:var(--muted)}.footer{background:var(--navy);color:#94a3b8;padding:38px 0;text-align:center;font-size:12px}
    @media(max-width:900px){.modules,.subjects{grid-template-columns:repeat(2,1fr)}.reader-layout{grid-template-columns:1fr}.toc{position:static;max-height:300px}.reader-progress{display:none}}@media(max-width:620px){.shell{width:min(100% - 28px,1180px)}.credential{display:none}.hero{padding:58px 0}.hero h1{font-size:36px}.modules,.subjects{grid-template-columns:1fr}.section{padding:45px 0}.section-head{align-items:flex-start;flex-direction:column}.paper{padding:25px 20px}.paper-content{font-size:17px}.reader-nav{flex-direction:column}.nav-btn{width:100%}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell nav"><a class="brand" href="#inicio"><span class="brand-mark"><i class="fa-solid fa-car-side"></i></span><span><small>INSTRUTOR AUTÔNOMO</small><strong>MICAEL LUCAS</strong></span></a><span class="credential"><i class="fa-solid fa-shield-halved"></i> Instrutor credenciado pelo Detran</span></div></header>
  <main id="app" aria-live="polite"></main>
  <footer class="footer"><div class="shell">Conteúdo de apoio à formação de condutores · Estude com responsabilidade e consulte sempre a legislação atualizada.</div></footer>
  <script src="content/legislacao.js"></script><script src="content/direcao-defensiva.js"></script><script src="content/primeiros-socorros.js"></script><script src="content/cidadania.js"></script><script src="content/meio-ambiente.js"></script><script src="content/mecanica.js"></script>
  <script>
    const app=document.querySelector('#app'),subjects=window.manualSubjects||[],storageKey='micael-manual-progress-v1',progress=JSON.parse(localStorage.getItem(storageKey)||'{}');
    const modules=[['#2563eb','fa-id-card','PASSO A PASSO','Guia Definitivo da CNH','Entenda o processo da primeira habilitação, dos exames às aulas e à aprovação.'],['#f59e0b','fa-book-open','CONTEÚDO COMPLETO','Preparatório para Prova Teórica','Leia o conteúdo completo do manual, organizado em seis disciplinas.'],['#4f46e5','fa-brain','PSICOTÉCNICO','Desmistificando o Exame Psicológico','Orientações para entender a avaliação e chegar mais tranquilo.'],['#e11d48','fa-clipboard-check','TESTE REAL','Simulados Oficiais Detran','Treine seus conhecimentos em um ambiente focado na prova.'],['#059669','fa-car','ETAPA FINAL','Preparação para a Prova Prática','Percurso, comandos do examinador e faltas mais comuns.'],['#2563eb','fa-circle-question','SUPORTE & FAQ','Central de Dúvidas Frequentes','Respostas rápidas sobre prazos, taxas e reagendamentos.']];
    function getDone(slug){return progress[slug]||[]}function saveDone(slug,page){const done=new Set(getDone(slug));done.add(page);progress[slug]=[...done];localStorage.setItem(storageKey,JSON.stringify(progress))}function percent(s){return Math.round(getDone(s.slug).length/s.pages.length*100)||0}function escapeHtml(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function paragraphs(text){const sentences=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text],groups=[];let current='';sentences.forEach(s=>{if(current.length>520){groups.push(current.trim());current=''}current+=s+' '});if(current.trim())groups.push(current.trim());return groups.map(p=>'<p>'+escapeHtml(p)+'</p>').join('')}
    function renderHome(){app.innerHTML=`<section class="hero"><div class="shell hero-inner"><span class="eyebrow"><i class="fa-solid fa-graduation-cap"></i> Plataforma teórica de apoio</span><h1>Plataforma de Estudos<br><span>Instrutor Micael Lucas</span></h1><p>Sua direção começa com confiança. Prepare-se com conteúdo organizado e avance no seu ritmo para a prova teórica.</p></div></section><section class="section"><div class="shell"><div class="section-head"><div><div class="section-title"><i class="fa-solid fa-layer-group"></i><h2>Módulos do Sistema de Ensino</h2></div><p>Toque em um módulo para acessar conteúdos e orientações.</p></div><span class="pill">6 módulos disponíveis</span></div><div class="modules">${modules.map((m,i)=>`<article class="card ${i===1?'featured':''}" style="--accent:${m[0]}"><div class="card-top"><span class="icon"><i class="fa-solid ${m[1]}"></i></span><span class="tag">${m[2]}</span></div><h3>${m[3]}</h3><p>${m[4]}</p><div class="card-foot"><span><i class="fa-regular fa-clock"></i> ${i===1?'Leitura por disciplina':'Em breve'}</span><button class="card-action" ${i===1?'data-open-library':'disabled'}>${i===1?'Acessar módulo →':'Em breve'}</button></div></article>`).join('')}</div></div></section>`;app.querySelector('[data-open-library]').onclick=()=>location.hash='biblioteca'}
    function renderLibrary(){const total=subjects.reduce((n,s)=>n+s.pages.length,0);app.innerHTML=`<section class="library-hero"><div class="shell"><div class="crumb"><button onclick="location.hash='inicio'">Início</button><i class="fa-solid fa-chevron-right"></i><span>Preparatório para Prova Teórica</span></div><span class="eyebrow"><i class="fa-solid fa-book-open"></i> Biblioteca de estudos</span><h1>Escolha uma disciplina</h1><p>O conteúdo do manual foi convertido em uma experiência de leitura, sem incorporar o arquivo PDF. Seu progresso fica salvo neste dispositivo.</p><div class="stats"><span class="stat"><strong>${subjects.length}</strong> disciplinas</span><span class="stat"><strong>${total}</strong> páginas de conteúdo</span><span class="stat"><strong>Busca</strong> dentro de cada disciplina</span></div></div></section><section class="section"><div class="shell"><div class="section-head"><div><h2>Conteúdo do curso teórico</h2><p>Estude na ordem que preferir e retome de onde parou.</p></div></div><div class="subjects">${subjects.map(s=>`<article class="subject" style="--accent:${s.accent}"><span class="icon"><i class="fa-solid ${s.icon}"></i></span><h3>${s.title}</h3><p>${s.description}</p><div class="progress-track"><div class="progress-fill" style="width:${percent(s)}%"></div></div><div class="subject-meta"><span>${s.pages.length} páginas</span><span>${percent(s)}% concluído</span></div><button data-subject="${s.slug}">${percent(s)?'Continuar estudando':'Começar disciplina'} <i class="fa-solid fa-arrow-right"></i></button></article>`).join('')}</div></div></section>`;app.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>location.hash='disciplina/'+b.dataset.subject)}
    function renderReader(slug,requestedPage){const subject=subjects.find(s=>s.slug===slug);if(!subject){location.hash='biblioteca';return}let index=Math.max(0,subject.pages.findIndex(p=>p.page===Number(requestedPage)));if(!requestedPage){const done=getDone(slug);index=Math.min(done.length,subject.pages.length-1)}const page=subject.pages[index];saveDone(slug,page.page);app.innerHTML=`<section class="reader"><div class="reader-top"><div class="shell reader-top-row"><div><div class="crumb"><button onclick="location.hash='biblioteca'">Biblioteca</button><i class="fa-solid fa-chevron-right"></i><span>Disciplina</span></div><h1>${subject.title}</h1></div><div class="reader-progress"><span>${percent(subject)}% da disciplina concluída</span><div class="progress-track"><div class="progress-fill" style="width:${percent(subject)}%"></div></div></div></div></div><div class="shell reader-layout"><aside class="toc"><div class="toc-head"><input class="search" id="page-search" type="search" placeholder="Buscar nesta disciplina…" aria-label="Buscar nesta disciplina"></div><div class="toc-list" id="toc-list">${tocItems(subject,page.page,'')}</div></aside><article><div class="paper"><span class="paper-label">${subject.title} · Página ${page.page} do manual</span><h2>${pageHeading(page.text,subject.title)}</h2><div class="paper-content">${paragraphs(page.text)}</div></div><div class="reader-nav"><button class="nav-btn" id="prev" ${index===0?'disabled':''}><i class="fa-solid fa-arrow-left"></i> Página anterior</button><button class="nav-btn primary" id="next" ${index===subject.pages.length-1?'disabled':''}>Próxima página <i class="fa-solid fa-arrow-right"></i></button></div></article></div></section>`;document.querySelector('#prev').onclick=()=>goPage(subject,index-1);document.querySelector('#next').onclick=()=>goPage(subject,index+1);document.querySelector('#page-search').oninput=e=>{document.querySelector('#toc-list').innerHTML=tocItems(subject,page.page,e.target.value);bindToc(subject)};bindToc(subject);scrollTo({top:0,behavior:'smooth'})}
    function pageHeading(text,fallback){const h=text.split(/[.!?]/)[0].replace(/^Capítulo\s+\d+\s*-?\s*/i,'').trim();return h.length>8&&h.length<100?h:fallback}function tocItems(subject,current,query){const q=query.trim().toLocaleLowerCase('pt-BR'),pages=subject.pages.filter(p=>!q||p.text.toLocaleLowerCase('pt-BR').includes(q));if(!pages.length)return'<div class="empty">Nenhum trecho encontrado.</div>';return pages.map(p=>`<button class="toc-item ${p.page===current?'active':''} ${getDone(subject.slug).includes(p.page)?'done':''}" data-page="${p.page}"><span class="page-dot">${p.page}</span><span>${pageHeading(p.text,'Conteúdo da página '+p.page)}</span></button>`).join('')}function bindToc(subject){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>location.hash='disciplina/'+subject.slug+'/'+b.dataset.page)}function goPage(subject,index){if(index>=0&&index<subject.pages.length)location.hash='disciplina/'+subject.slug+'/'+subject.pages[index].page}
    function router(){const route=(location.hash||'#inicio').slice(1).split('/');if(route[0]==='biblioteca')renderLibrary();else if(route[0]==='disciplina')renderReader(route[1],route[2]);else renderHome()}addEventListener('hashchange',router);router();
  </script>
</body>
</html>
